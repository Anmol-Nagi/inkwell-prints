<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Order – Inkwell Prints</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="order"><div id="hd"></div><main class="page"><div class="wrap"><h2>Place your order</h2><p class="sub">Upload your photo or design and tell us what you need. We reply with the final price.</p><form name="order" method="POST" action="thanks.html" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field"><input type="hidden" name="form-name" value="order"><p hidden><label>Do not fill this<input name="bot-field"></label></p><label>Product<select name="product" id="prod"></select></label><label>Your name<input name="name" required autocomplete="name"></label><label>Phone or WhatsApp number<input name="phone" type="tel" required autocomplete="tel"></label><label>Quantity<input name="qty" inputmode="numeric" value="1"></label><label>Size or area<input name="size" placeholder="e.g. A3, or 20 walls"></label><label>Upload photo or design<input name="file" type="file" accept="image/*,.pdf" multiple><small>JPG, PNG or PDF. Keep it under 8 MB in total.</small></label><label>Notes<textarea name="notes" rows="3" placeholder="Deadline, colours, location for sticking"></textarea></label><button class="btn" type="submit">Send order</button></form></div></main><div id="ft"></div><script src="js/app.js"></script></body></html>
